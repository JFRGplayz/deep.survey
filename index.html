<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deep Survey</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="camera">

        <div id="camera-view">
            <div class="water-particles"></div>
            <div class="seafloor"></div>

            <div class="camera-label">
                EXTERNAL CAMERA
            </div>
        </div>


        <section id="top-data" class="data-screen">

            <div>
                <span>DEPTH</span>
                <strong id="depth">0 m</strong>
            </div>

            <div>
                <span>HEADING</span>
                <strong id="heading">000°</strong>
            </div>

            <div>
                <span>SPEED</span>
                <strong id="speed">0.0 kn</strong>
            </div>

        </section>


        <section id="system-screen" class="data-screen">

            <h2>SYSTEMS</h2>

            <p>
                OXYGEN
                <span id="oxygen">100%</span>
            </p>

            <p>
                BATTERY
                <span id="battery">100%</span>
            </p>

            <p>
                HULL
                <span id="hull">100%</span>
            </p>

        </section>


        <section id="sonar-screen" class="data-screen">

            <h2>SONAR</h2>

            <div id="sonar">

                <div class="sonar-circle">
                    <div class="sonar-sweep"></div>
                    <div class="sonar-center"></div>
                </div>

            </div>

            <p id="contacts">
                CONTACTS: 0
            </p>

        </section>


        <section id="navigation-screen" class="data-screen">

            <h2>NAVIGATION</h2>

            <p>
                POSITION
                <span id="position">UNKNOWN</span>
            </p>

            <p>
                DEPTH
                <span id="nav-depth">0 m</span>
            </p>

            <p>
                STATUS
                <span>EXPLORING</span>
            </p>

        </section>


        <section id="log-screen" class="data-screen">

            <h2>SURVEY LOG</h2>

            <div id="log">
                <p>> SYSTEM INITIALIZED</p>
                <p>> CAMERA ONLINE</p>
                <p>> SUBMERSIBLE READY</p>
            </div>

        </section>

    </main>

    <script src="game.js"></script>

</body>

</html>
